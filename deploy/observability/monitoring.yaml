apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: portal-api
  labels:
    app.kubernetes.io/part-of: remeselnicky-portal
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: portal-api
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: portal-worker
  labels:
    app.kubernetes.io/part-of: remeselnicky-portal
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: portal-worker
  endpoints:
    - port: monitoring
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: portal-operational-alerts
  labels:
    app.kubernetes.io/part-of: remeselnicky-portal
spec:
  groups:
    - name: portal.availability
      rules:
        - alert: PortalApiUnavailable
          expr: absent(up{service="portal-api"}) or up{service="portal-api"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Portal API metrics target is unavailable
            runbook: docs/runbooks/api-or-database-unavailable.md
        - alert: PortalDatabaseUnavailable
          expr: max_over_time(portal_database_available{service="api"}[2m]) == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Portal API readiness cannot reach PostgreSQL
            runbook: docs/runbooks/api-or-database-unavailable.md
        - alert: PortalWorkerUnavailable
          expr: absent(portal_worker_ready{service="worker"}) or portal_worker_ready{service="worker"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Portal background worker is not ready
            runbook: docs/runbooks/http-or-worker-degradation.md
    - name: portal.http
      rules:
        - alert: PortalApiServerErrorSpike
          expr: sum(rate(portal_http_requests_total{service="api",result="server_error"}[5m])) / clamp_min(sum(rate(portal_http_requests_total{service="api"}[5m])), 1) > 0.10
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Portal API server-error ratio exceeds the conservative alpha threshold
            runbook: docs/runbooks/http-or-worker-degradation.md
        - alert: PortalApiP95LatencyHigh
          expr: histogram_quantile(0.95, sum by (le) (rate(portal_http_request_duration_milliseconds_bucket{service="api"}[5m]))) > 2500
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Portal API p95 latency exceeds the conservative alpha threshold
            runbook: docs/runbooks/http-or-worker-degradation.md
    - name: portal.queue
      rules:
        - alert: PortalQueueTerminalFailure
          expr: increase(portal_queue_jobs_total{outcome="terminal_failure"}[5m]) > 0
          labels:
            severity: critical
          annotations:
            summary: A queued operation reached terminal failure
            runbook: docs/runbooks/queue-terminal-failure.md
        - alert: PortalQueueLag
          expr: portal_queue_oldest_pending_age_seconds > 300
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Queue processing is delayed
            runbook: docs/runbooks/queue-terminal-failure.md
    - name: portal.invariants
      rules:
        - alert: PortalCriticalInvariantViolation
          expr: portal_invariant_violations{service="worker"} > 0
          labels:
            severity: critical
          annotations:
            summary: A read-only critical domain invariant check found inconsistent state
            runbook: docs/runbooks/critical-invariant-violation.md
        - alert: PortalInvariantCheckerFailed
          expr: portal_invariant_check_success{service="worker"} == 0 or time() - portal_invariant_last_check_timestamp_seconds{service="worker"} > 900
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: The operational invariant checker is failing or stale
            runbook: docs/runbooks/critical-invariant-violation.md
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: portal-critical-alert-channel
  labels:
    app.kubernetes.io/part-of: remeselnicky-portal
spec:
  route:
    receiver: portal-critical-webhook
    groupBy: [alertname, namespace]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 2h
    matchers:
      - name: severity
        value: critical
  receivers:
    - name: portal-critical-webhook
      webhookConfigs:
        - urlSecret:
            name: portal-critical-alert-channel
            key: webhook-url
          sendResolved: true
          maxAlerts: 10
