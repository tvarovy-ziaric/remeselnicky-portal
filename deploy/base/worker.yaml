apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-worker
  labels:
    app.kubernetes.io/name: portal-worker
    app.kubernetes.io/part-of: remeselnicky-portal
spec:
  # The current bootstrap worker is one-shot. A queue-worker ticket must add its
  # durable run loop and probes before an overlay scales this above zero.
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: portal-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal-worker
        app.kubernetes.io/part-of: remeselnicky-portal
    spec:
      serviceAccountName: portal-worker
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: registry.invalid/remeselnicky-portal/worker:release-revision
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: portal-runtime-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: portal-runtime-secrets
                  key: DATABASE_URL
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: portal-runtime-secrets
                  key: SESSION_SECRET
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
