apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-worker
  labels:
    app.kubernetes.io/name: portal-worker
    app.kubernetes.io/part-of: remeselnicky-portal
spec:
  # Keep this bootstrap adapter at zero until a durable production queue is
  # configured. The worker loop and internal probes are already deployable.
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: portal-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal-worker
        app.kubernetes.io/part-of: remeselnicky-portal
    spec:
      serviceAccountName: portal-worker
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: registry.invalid/remeselnicky-portal/worker:release-revision
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: portal-runtime-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: portal-runtime-secrets
                  key: DATABASE_URL
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: portal-runtime-secrets
                  key: SESSION_SECRET
          ports:
            - name: monitoring
              containerPort: 9465
          readinessProbe:
            httpGet:
              path: /health/ready
              port: monitoring
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: monitoring
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: portal-worker
  labels:
    app.kubernetes.io/name: portal-worker
    app.kubernetes.io/part-of: remeselnicky-portal
spec:
  selector:
    app.kubernetes.io/name: portal-worker
  ports:
    - name: monitoring
      port: 9465
      targetPort: monitoring
