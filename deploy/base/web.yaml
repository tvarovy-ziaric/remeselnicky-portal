apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-web
  labels:
    app.kubernetes.io/name: portal-web
    app.kubernetes.io/part-of: remeselnicky-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: portal-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal-web
        app.kubernetes.io/part-of: remeselnicky-portal
    spec:
      serviceAccountName: portal-web
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: registry.invalid/remeselnicky-portal/web:release-revision
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: portal-runtime-config
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: next-cache
              mountPath: /app/apps/web/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: next-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: portal-web
spec:
  selector:
    app.kubernetes.io/name: portal-web
  ports:
    - name: http
      port: 3000
      targetPort: http
