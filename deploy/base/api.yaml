apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-api
  labels:
    app.kubernetes.io/name: portal-api
    app.kubernetes.io/part-of: remeselnicky-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: portal-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal-api
        app.kubernetes.io/part-of: remeselnicky-portal
    spec:
      serviceAccountName: portal-api
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: registry.invalid/remeselnicky-portal/api:release-revision
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: portal-runtime-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: portal-runtime-secrets
                  key: DATABASE_URL
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: portal-runtime-secrets
                  key: SESSION_SECRET
            - name: OBJECT_STORAGE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: portal-runtime-secrets
                  key: OBJECT_STORAGE_ACCESS_KEY_ID
            - name: OBJECT_STORAGE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: portal-runtime-secrets
                  key: OBJECT_STORAGE_SECRET_ACCESS_KEY
          ports:
            - name: http
              containerPort: 3001
            - name: metrics
              containerPort: 9464
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: portal-api
  labels:
    app.kubernetes.io/name: portal-api
    app.kubernetes.io/part-of: remeselnicky-portal
spec:
  selector:
    app.kubernetes.io/name: portal-api
  ports:
    - name: http
      port: 3001
      targetPort: http
    - name: metrics
      port: 9464
      targetPort: metrics
