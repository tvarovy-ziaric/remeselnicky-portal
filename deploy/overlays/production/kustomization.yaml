apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: portal-production
resources:
  - ../../base
  - namespace.yaml
  - ingress.yaml
  - ../../observability/monitoring.yaml
configMapGenerator:
  - name: portal-runtime-config
    literals:
      - APP_ENV=production
      - APP_ORIGIN=https://portal.invalid
      - NEXT_PUBLIC_APP_ENV=production
      - NEXT_PUBLIC_RELEASE_REVISION=release-revision
      - PORTAL_API_ORIGIN=http://portal-api:3001
      - OBJECT_STORAGE_ENDPOINT=https://objects.portal.invalid
      - OBJECT_STORAGE_FORCE_PATH_STYLE=false
      - OBJECT_STORAGE_PRIVATE_CONTAINER=portal-production-private
      - OBJECT_STORAGE_PUBLIC_BASE_URL=https://media.portal.invalid/
      - OBJECT_STORAGE_PUBLIC_DERIVATIVE_CONTAINER=portal-production-public
      - OBJECT_STORAGE_REGION=provider-region
      - MALWARE_SCANNER_HOST=127.0.0.1
      - MALWARE_SCANNER_PORT=3310
      - PORT=3001
      - RELEASE_REVISION=release-revision
generatorOptions:
  disableNameSuffixHash: true
commonAnnotations:
  portal.remeselnicky.dev/release-revision: release-revision
patches:
  - path: replicas.yaml
