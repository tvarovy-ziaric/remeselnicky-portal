name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      IMAGE_PREFIX: ${{ vars.STAGING_IMAGE_PREFIX }}
      KUBE_CONFIG_STAGING_B64: ${{ secrets.KUBE_CONFIG_STAGING_B64 }}
      REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      RELEASE_REVISION: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check out release revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_REVISION }}
          persist-credentials: false

      - name: Validate deployment inputs and skeleton
        shell: bash
        run: |
          set -euo pipefail
          node deploy/scripts/validate.mjs
          [[ "$RELEASE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_PREFIX" =~ ^[A-Za-z0-9][A-Za-z0-9._/:@-]+$ ]]
          test -n "$REGISTRY_HOST"
          test -n "$REGISTRY_USERNAME"
          test -n "$REGISTRY_PASSWORD"
          test -n "$KUBE_CONFIG_STAGING_B64"

      - name: Build and push revision images
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" --username "$REGISTRY_USERNAME" --password-stdin
          for service in web api worker; do
            build_args=(--build-arg "RELEASE_REVISION=$RELEASE_REVISION")
            if [[ "$service" == "web" ]]; then
              build_args+=(--build-arg "DEPLOYMENT_ENV=staging")
            fi
            docker build \
              "${build_args[@]}" \
              --file "apps/$service/Dockerfile" \
              --tag "$IMAGE_PREFIX/$service:$RELEASE_REVISION" .
            docker push "$IMAGE_PREFIX/$service:$RELEASE_REVISION"
          done
          docker logout "$REGISTRY_HOST"

      - name: Render staging manifests
        shell: bash
        run: |
          set -euo pipefail
          kubectl kustomize deploy/overlays/staging > "$RUNNER_TEMP/staging.yaml"
          sed -i \
            -e "s#registry.invalid/remeselnicky-portal#$IMAGE_PREFIX#g" \
            -e "s#release-revision#$RELEASE_REVISION#g" \
            "$RUNNER_TEMP/staging.yaml"
          ! grep -Eq 'registry\.invalid|release-revision|kind: Secret' "$RUNNER_TEMP/staging.yaml"

      - name: Deploy and smoke-test staging
        shell: bash
        run: |
          set -euo pipefail
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          printf '%s' "$KUBE_CONFIG_STAGING_B64" | base64 --decode > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
          kubectl -n portal-staging get secret portal-runtime-secrets >/dev/null
          kubectl -n portal-staging get secret portal-tls >/dev/null
          kubectl apply -f "$RUNNER_TEMP/staging.yaml"
          kubectl -n portal-staging rollout status deployment/portal-api --timeout=180s
          kubectl -n portal-staging rollout status deployment/portal-web --timeout=180s
          kubectl -n portal-staging port-forward service/portal-api 18081:3001 >"$RUNNER_TEMP/api-port-forward.log" 2>&1 &
          API_FORWARD_PID=$!
          kubectl -n portal-staging port-forward service/portal-web 18080:3000 >"$RUNNER_TEMP/web-port-forward.log" 2>&1 &
          WEB_FORWARD_PID=$!
          trap 'kill "$API_FORWARD_PID" "$WEB_FORWARD_PID" 2>/dev/null || true' EXIT
          sleep 3
          curl --fail --silent --show-error http://127.0.0.1:18081/health/live >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:18081/health/ready >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:18080/ >/dev/null
