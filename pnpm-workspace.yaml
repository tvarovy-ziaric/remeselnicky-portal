packages:
  - "apps/*"
  - "packages/*"

# Allow reproducible container builds on slower links without disabling checks.
networkConcurrency: 8
fetchRetries: 4
fetchTimeout: 300000

catalog:
  "@types/node": 26.5.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  eslint: 10.10.0
  tsx: 4.23.13
  typescript: 5.9.3
  vitest: 3.2.7

allowBuilds:
  argon2: true
  esbuild: true
  sharp: true
