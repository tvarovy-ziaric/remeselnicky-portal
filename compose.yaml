name: remeselnicky-portal

services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_DB: ${PORTAL_POSTGRES_DB:-portal}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      POSTGRES_PASSWORD: ${PORTAL_POSTGRES_PASSWORD:?Set PORTAL_POSTGRES_PASSWORD for the local migration owner}
      POSTGRES_USER: ${PORTAL_POSTGRES_USER:-portal_owner}
      PORTAL_APP_DB_PASSWORD: ${PORTAL_APP_DB_PASSWORD:?Set PORTAL_APP_DB_PASSWORD for the local runtime login}
      PORTAL_APP_DB_USER: ${PORTAL_APP_DB_USER:-portal_app}
    ports:
      - "127.0.0.1:${PORTAL_POSTGRES_PORT:-5432}:5432"
    volumes:
      - portal-postgres-data:/var/lib/postgresql/data
      - ./packages/db/migrations/0000_enable_postgis.sql:/docker-entrypoint-initdb.d/0000_enable_postgis.sql:ro
      - ./infra/postgres/init/010-create-application-role.sh:/docker-entrypoint-initdb.d/010-create-application-role.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  portal-postgres-data:
    name: portal-postgres-data
